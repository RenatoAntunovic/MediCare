<section class="mc-card" aria-labelledby="settings-security">
  <h2 class="mc-card__title" id="settings-security">Sigurnost</h2>
  <p class="mc-security__hint">
    Nakon promjene lozinke bit ćete odjavljeni sa svih uređaja.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field appearance="outline" class="mc-security__field">
      <mat-label>Trenutna lozinka</mat-label>
      <input matInput [type]="hideCurrent ? 'password' : 'text'"
             formControlName="currentPassword" autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="hideCurrent = !hideCurrent"
              [attr.aria-label]="hideCurrent ? 'Prikaži lozinku' : 'Sakrij lozinku'">
        <mat-icon>{{ hideCurrent ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-error>Unesite trenutnu lozinku</mat-error>
    </mat-form-field>

    <div class="mc-security__grid">
      <mat-form-field appearance="outline">
        <mat-label>Nova lozinka</mat-label>
        <input matInput [type]="hideNew ? 'password' : 'text'"
               formControlName="newPassword" autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew"
                [attr.aria-label]="hideNew ? 'Prikaži lozinku' : 'Sakrij lozinku'">
          <mat-icon>{{ hideNew ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-hint>Najmanje 6 znakova</mat-hint>
        <mat-error *ngIf="form.controls.newPassword.hasError('required')">Unesite novu lozinku</mat-error>
        <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">Najmanje 6 znakova</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Potvrdite novu lozinku</mat-label>
        <input matInput [type]="hideNew ? 'password' : 'text'"
               formControlName="confirmPassword" autocomplete="new-password" />
        <mat-error>Potvrdite novu lozinku</mat-error>
      </mat-form-field>
    </div>

    <p *ngIf="form.hasError('mismatch') && form.controls.confirmPassword.touched"
       class="mc-security__error" role="alert">
      Lozinke se ne podudaraju.
    </p>

    <p *ngIf="serverError" class="mc-security__error" role="alert">{{ serverError }}</p>

    <div class="mc-security__actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">
        <mat-icon>lock_reset</mat-icon>
        {{ isSaving ? 'Mijenjam…' : 'Promijeni lozinku' }}
      </button>
    </div>
  </form>
</section>
