<mat-card class="auth-card auth-logout" @fadeInUp>
  <mat-card-content>
    <div class="auth-logout__icon" aria-hidden="true">
      <mat-icon>check_circle_outline</mat-icon>
    </div>

    <h1 class="auth-card__title">{{ 'AUTH.LOGOUT.TITLE' | translate }}</h1>
    <p class="auth-card__subtitle" role="status">{{ 'AUTH.LOGOUT.MESSAGE' | translate }}</p>

    <div class="auth-logout__progress">
      <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
      <div class="auth-logout__countdown">
        <mat-icon aria-hidden="true">schedule</mat-icon>
        <span>{{ 'AUTH.LOGOUT.REDIRECT_IN' | translate : { seconds: countdownSeconds } }}</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
