<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" *ngIf="!isLoading && form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'MEDICINE_CATEGORIES.FORM.NAME' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        [placeholder]="'MEDICINE_CATEGORIES.FORM.NAME_PLACEHOLDER' | translate"
        maxlength="100"
        autocomplete="off"
      />
      <mat-error *ngIf="form.get('name')?.invalid">
        {{ getErrorMessage('name') }}
      </mat-error>
      <mat-hint align="end">{{ form.get('name')?.value?.length || 0 }}/100</mat-hint>
    </mat-form-field>
  </form>

  <div *ngIf="isLoading && !form" class="mc-state" role="status">
    <mat-progress-spinner mode="indeterminate" diameter="36" strokeWidth="4"></mat-progress-spinner>
    <span>{{ 'MEDICINE_CATEGORIES.FORM.LOADING' | translate }}</span>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()" [disabled]="isLoading">
    {{ 'MEDICINE_CATEGORIES.FORM.CANCEL' | translate }}
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="onSubmit()"
    [disabled]="!form || form.invalid || isLoading"
  >
    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    <mat-icon *ngIf="!isLoading">{{ isEditMode ? 'edit' : 'save' }}</mat-icon>
    {{
      isEditMode
        ? ('MEDICINE_CATEGORIES.FORM.UPDATE' | translate)
        : ('MEDICINE_CATEGORIES.FORM.SAVE' | translate)
    }}
  </button>
</mat-dialog-actions>
